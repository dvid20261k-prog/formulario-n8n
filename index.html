<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <style>
        /* Estilos básicos para que el formulario se vea presentable */
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Registro de Datos</h2>
    <form id="miFormulario">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>
        <button type="submit">Enviar</button>
    </form>

    <script>
        // Capturamos el evento de enviar el formulario
        document.getElementById('miFormulario').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue al dar clic en enviar

            // 1. Recopilamos los datos del formulario en un objeto JSON
            const datos = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                telefono: document.getElementById('telefono').value
            };

            // 2. Definimos la URL del Webhook de n8n (¡AQUÍ DEBES PEGAR TU URL!)
            const webhookUrl = 'https://kapcha.app.n8n.cloud/webhook/formulario-contacto';

            // 3. Enviamos los datos usando Fetch API con el método POST
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if (response.ok) {
                    alert('¡Datos enviados con éxito a n8n!');
                    document.getElementById('miFormulario').reset(); // Limpia los campos del formulario
                } else {
                    alert('Hubo un problema al enviar los datos. Revisa la URL.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error de conexión.');
            });
        });
    </script>

</body>
</html>
